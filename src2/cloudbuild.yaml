steps:
  # 1. Build rhino-compute-linux image
  - name: 'gcr.io/cloud-builders/docker'
    id: 'build-rhino-compute'
    dir: 'src2/rhino-compute'
    args:
      - 'build'
      - '-t'
      - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/rhino-compute-linux:latest'
      - '-t'
      - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/rhino-compute-linux:${_TAG}'
      - '.'

  # 2. Build cnc-web-server image
  - name: 'gcr.io/cloud-builders/docker'
    id: 'build-web-server'
    dir: 'src2/web-server'
    args:
      - 'build'
      - '-t'
      - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/cnc-web-server:latest'
      - '-t'
      - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/cnc-web-server:${_TAG}'
      - '.'

  # 3. Push images to Google Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    id: 'push-rhino-compute'
    args:
      - 'push'
      - '--all-tags'
      - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/rhino-compute-linux'

  - name: 'gcr.io/cloud-builders/docker'
    id: 'push-web-server'
    args:
      - 'push'
      - '--all-tags'
      - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/cnc-web-server'

  # 4. Deploy private rhino-compute-linux to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'deploy-rhino-compute'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        gcloud run deploy rhino-compute-linux \
          --image="${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/rhino-compute-linux:${_TAG}" \
          --region="${_REGION}" \
          --platform=managed \
          --no-allow-unauthenticated \
          --execution-environment=gen2 \
          --cpu=2 \
          --memory=4Gi \
          --no-cpu-throttling \
          --timeout=300s \
          --min-instances=0 \
          --max-instances=2 \
          --port=8080 \
          --set-secrets="RHINO_COMPUTE_KEY=rhino-compute-key:latest,RHINO_TOKEN=rhino-token:latest" \
          --quiet

  # 5. Deploy public cnc-web-server to Cloud Run (pointing to private rhino-compute)
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'deploy-web-server'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        COMPUTE_URL=$(gcloud run services describe rhino-compute-linux --region="${_REGION}" --format="value(status.url)")
        echo "Linking cnc-web-server to Rhino Compute at $${COMPUTE_URL}..."

        gcloud run deploy cnc-web-server \
          --image="${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/cnc-web-server:${_TAG}" \
          --region="${_REGION}" \
          --platform=managed \
          --allow-unauthenticated \
          --service-account="cnc-web-sa@${PROJECT_ID}.iam.gserviceaccount.com" \
          --cpu=1 \
          --memory=512Mi \
          --min-instances=0 \
          --max-instances=2 \
          --port=8080 \
          --set-env-vars="RHINO_COMPUTE_URL=$${COMPUTE_URL},NODE_ENV=production" \
          --set-secrets="RHINO_COMPUTE_KEY=rhino-compute-key:latest" \
          --quiet

substitutions:
  _REGION: 'us-central1'
  _REPO: 'colab-containers'
  _TAG: 'latest'

images:
  - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/rhino-compute-linux:${_TAG}'
  - '${_REGION}-docker.pkg.dev/${PROJECT_ID}/${_REPO}/cnc-web-server:${_TAG}'

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: 'E2_HIGHCPU_8'
