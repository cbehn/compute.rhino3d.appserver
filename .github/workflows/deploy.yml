name: Build and Deploy to ACA

on:
  push:
    branches: [ "prod" ] # I kept just 'prod' to match your intent, adjust as needed

permissions:
  id-token: write # Required for Azure login if using OIDC
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v3

      # 1. Log in to Docker Hub
      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # 2. Build and Push (Using SHA tag)
      - name: Build and Push Image
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          # We tag with BOTH latest (for humans) and the SHA (for Azure reliability)
          tags: |
            cbehn2/cnc-app-server:latest
            cbehn2/cnc-app-server:${{ github.sha }}

      # 3. Log in to Azure (You need the AZURE_CREDENTIALS secret)
      - name: Azure Login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      # 4. Deploy to Azure Container Apps
      - name: Deploy to Azure Container Apps
        uses: azure/container-apps-deploy-action@v1
        with:
          # Tell Azure to pull the SPECIFIC commit SHA we just built
          imageToDeploy: cbehn2/cnc-app-server:${{ github.sha }}
          resourceGroup: CNC-RhinoCompute
          containerAppName: rhino-appserver-ca
          targetPort: 3000
