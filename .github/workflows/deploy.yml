name: Build and Deploy to ACA

on:
  push:
    branches: [ "prod" ] # This ensures it only runs when code hits 'prod'

permissions:
  id-token: write
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v3

      # 1. Log in to Docker Hub (Using the secrets you confirmed earlier)
      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # 2. Build and Push with SHA tag
      # We push 'latest' for humans, and 'github.sha' for Azure automation
      - name: Build and Push Image
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: |
            cbehn2/cnc-app-server:latest
            cbehn2/cnc-app-server:${{ github.sha }}

      # 3. Azure Login
      - name: Azure Login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      # 4. Trigger Deployment in Azure
      - name: Deploy to Azure Container Apps
        uses: azure/container-apps-deploy-action@v1
        with:
          # IMPORTANT: We deploy the SHA version, not 'latest'
          imageToDeploy: cbehn2/cnc-app-server:${{ github.sha }}
          resourceGroup: CNC-RhinoCompute
          containerAppName: rhino-appserver-ca
          targetPort: 3000